<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#33454c">
<title>Ingemad Estaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: tablet-first shop-floor app. Top bar with station tabs; station view = scan bar, then queue | work panel; supervisor = KPI strip + flow board. */
:root{
  --bg:#e9ecec; --panel:#f7f8f8; --line:#cfd5d6; --ink:#1b2326; --muted:#5d6a6e;
  --steel:#33454c; --accent:#f0b400; --accent-ink:#1b1a12;
  --ok:#1f8a4c; --warn:#c96a00; --bad:#c2352b; --run:#1d6fb8;
  --ok-bg:#dcefe3; --warn-bg:#f7e6cf; --bad-bg:#f6dad7; --run-bg:#d8e7f5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13181a; --panel:#1b2225; --line:#2f3a3e; --ink:#e6ebec; --muted:#93a1a5;
  --steel:#26343a; --accent:#f2bd1d; --accent-ink:#1b1a12;
  --ok:#4cc27e; --warn:#f0a03c; --bad:#ef6b5f; --run:#5aa6ec;
  --ok-bg:#163326; --warn-bg:#3a2a12; --bad-bg:#3d1c19; --run-bg:#14293d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181a; --panel:#1b2225; --line:#2f3a3e; --ink:#e6ebec; --muted:#93a1a5;
  --steel:#26343a; --accent:#f2bd1d; --accent-ink:#1b1a12;
  --ok:#4cc27e; --warn:#f0a03c; --bad:#ef6b5f; --run:#5aa6ec;
  --ok-bg:#163326; --warn-bg:#3a2a12; --bad-bg:#3d1c19; --run-bg:#14293d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);color:#eef2f3;
  display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{border:0;background:transparent;color:inherit;opacity:.75;padding:8px 12px;border-radius:6px;
  font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{opacity:1}
.tab[aria-current="true"]{opacity:1;background:var(--accent);color:var(--accent-ink)}
.tab .n{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.2);padding:1px 6px;border-radius:9px}
.bar-r{display:flex;gap:10px;align-items:center;font-size:13px}
.conn{display:inline-flex;align-items:center;gap:6px}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:#8a9599}
.conn.on::before{background:#4cc27e}
.conn.off::before{background:#ef6b5f}
.linkbtn{background:none;border:0;text-decoration:underline;color:inherit;opacity:.85;font-size:13px;padding:0}

main{padding:20px 16px 40px;max-width:1280px;margin:0 auto}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-transform:uppercase;letter-spacing:.04em}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted)}

.st-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.st-head .sub{color:var(--muted);margin-top:4px}
.op{display:flex;flex-direction:column;gap:4px}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px;max-width:100%}

/* scan bar */
.scan{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.scan .qr-ico{width:40px;height:40px;flex:none;color:var(--ink)}
.scan input{flex:1;min-width:200px;font-family:var(--mono);font-size:22px;min-height:56px;border-width:2px}
.scan input:focus{border-color:var(--accent);outline:none}
.scan .hint{flex-basis:100%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}

.cols{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}

.queue{display:flex;flex-direction:column;gap:8px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;width:100%;
  display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.card:hover{border-color:var(--muted)}
.card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--accent)}
.card.soon{opacity:.75;border-style:dashed}
.card .id{font-family:var(--mono);font-weight:600}
.card .cl{grid-column:1/-1;font-weight:500}
.card .sp{grid-column:1/-1;color:var(--muted);font-size:13px}
.card .ft{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:24px;color:var(--muted);text-align:center}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-cola{background:var(--line);color:var(--ink)}
.s-proceso{background:var(--run-bg);color:var(--run)}
.s-pausa{background:var(--warn-bg);color:var(--warn)}
.s-bloqueada{background:var(--bad-bg);color:var(--bad)}
.s-despachada{background:var(--ok-bg);color:var(--ok)}
.pri{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.pri.alta{border-color:var(--bad);color:var(--bad)}
.ex{font-size:11px;border:1px dashed var(--muted);color:var(--muted);padding:1px 6px;border-radius:4px}
.late{color:var(--bad);font-weight:600}
.due{color:var(--muted)}

.work{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:20px}
.work.blocked{background-image:repeating-linear-gradient(-45deg,transparent 0 14px,var(--bad-bg) 14px 28px);background-size:100% 8px;background-repeat:no-repeat}
.w-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.w-id{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1.1}
.w-cl{font-size:18px;font-weight:500}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 16px}
.specs div{display:flex;flex-direction:column;gap:2px;min-width:0}
.specs b{font-weight:600;overflow-wrap:anywhere}

.route{display:flex;overflow-x:auto;padding-bottom:4px}
.rstep{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center;position:relative}
.rstep::before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:3px;background:var(--line)}
.rstep:first-child::before{display:none}
.rstep .dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);background:var(--panel);z-index:1}
.rstep.done{color:var(--ink)} .rstep.done .dot{background:var(--ok);border-color:var(--ok)} .rstep.done::before{background:var(--ok)}
.rstep.now{color:var(--ink);font-weight:600} .rstep.now .dot{border-color:var(--accent);background:var(--accent)} .rstep.now::before{background:var(--ok)}
.rstep small{font-family:var(--mono);font-size:11px}

.clock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:48px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:52px;padding:0 20px;border-radius:8px;border:2px solid var(--ink);background:transparent;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.banner{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.banner.in{background:var(--run-bg);border:2px solid var(--run)}
.banner.out{background:var(--ok-bg);border:2px solid var(--ok)}
.banner.warn{background:var(--warn-bg);border:2px solid var(--warn)}
.banner b{font-size:17px}

.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-height:48px}
.chk input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ok)}
.chk.on{border-color:var(--ok)}
.chk.on span{color:var(--muted);text-decoration:line-through}
.chk input[type=number]{width:90px;min-height:36px;margin-left:auto}

.blockbox{border:2px solid var(--bad);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bad-bg)}
.reasons{display:flex;gap:8px;flex-wrap:wrap}
.reasons button{border:1px solid var(--bad);background:var(--panel);color:var(--bad);border-radius:6px;padding:10px 14px;font-weight:600}

.notes{display:flex;flex-direction:column;gap:8px}
.noteform{display:flex;gap:8px}
.noteform input{flex:1;min-width:0}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:13px;max-height:220px;overflow:auto}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.log time{font-family:var(--mono);color:var(--muted)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .full{grid-column:1/-1}
.label-prev{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.label-prev img{border:1px solid var(--line);border-radius:6px;width:100%;max-width:480px;background:#fff}
.picklist{display:flex;flex-direction:column;gap:6px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:42px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.alert b{color:var(--bad)}
.board-wrap{overflow-x:auto;margin-bottom:28px}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(150px,1fr));gap:10px;min-width:calc(var(--cols)*158px)}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.lane h3{margin:0 0 4px;font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.mini{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--bg);font-size:12px;text-align:left;width:100%;display:flex;flex-direction:column;gap:1px}
.mini .id{font-family:var(--mono);font-weight:600;font-size:13px}
.mini.proceso{border-left-color:var(--run)} .mini.pausa{border-left-color:var(--warn)} .mini.bloqueada{border-left-color:var(--bad)}
.mini .cl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn{display:flex;flex-direction:column;gap:8px}
.attn-row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
@media (max-width:560px){.attn-row{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono)}
.section{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.import{background:var(--panel);border:1px dashed var(--muted);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.import code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:500;z-index:10;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qrcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qrcard img{width:100%;max-width:140px;aspect-ratio:1;background:#fff;padding:6px;border-radius:4px}
.btn.xl{width:100%;min-height:76px;font-family:var(--display);font-size:28px;letter-spacing:.06em;text-transform:uppercase;border-radius:12px}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
select.need{border:2px solid var(--accent)}
.need-op{color:var(--warn);font-weight:600}
.card.running{border-color:var(--run);box-shadow:inset 4px 0 0 var(--run)}
.card .cr{display:flex;gap:6px;align-items:center}
.card .tm{font-weight:600;font-size:16px;color:var(--run)}
.card .cmpwrap{grid-column:1/-1}
.cmpwrap{display:flex;flex-direction:column;gap:6px}
.cmprow{font-size:14px}
.cmp{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:visible}
.cmpwrap.big .cmp{height:16px;border-radius:8px}
.cmp i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--muted)}
.cmp em{position:absolute;left:66.66%;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.cmp i.c-ok{background:var(--ok)} .cmp i.c-warn{background:var(--warn)} .cmp i.c-bad{background:var(--bad)}
.cmptxt{font-size:13px;font-weight:600;color:var(--muted)}
.cmptxt.c-ok,b.c-ok{color:var(--ok)} .cmptxt.c-warn,b.c-warn{color:var(--warn)} .cmptxt.c-bad,b.c-bad{color:var(--bad)}
.timerbox{display:flex;flex-direction:column;gap:12px;background:var(--bg);border-radius:10px;padding:16px}
.state-big .chip{font-size:15px;padding:5px 12px}
.state-big{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.done-head{display:flex;gap:16px;align-items:center}
.big-ok{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.newstate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:16px}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-height:32px;display:flex;align-items:center}
.work.idle{gap:10px}
@media (max-width:820px){
  .cols.has-panel .work{order:-1}
  .st-head{align-items:center}
  h1{font-size:30px}
  .op select{min-width:0;width:44vw}
  .scan{padding:10px;margin-bottom:14px}
  .scan input{font-size:20px;min-height:52px;min-width:0}
  .work{padding:16px}
  .timer{font-size:44px}
  .bar{gap:8px;padding:8px 12px}
  .brand{font-size:18px}
  .bar-r #clock{display:none}
  .stats b{font-size:22px;white-space:nowrap}
  .stats div{padding:10px 8px}
}
.scan .photo{white-space:nowrap}
@media (max-width:820px){.scan .photo{flex-basis:100%}}
.ocr-prev{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ocr-prev img{width:140px;max-width:40%;border-radius:8px;border:1px solid var(--line);object-fit:cover}
.ocr-side{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.cands{display:flex;flex-wrap:wrap;gap:6px}
.cand{font-family:var(--mono);font-weight:600;font-size:16px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);min-height:40px}
.cand.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.form textarea,#otform textarea{width:100%;font-family:var(--mono);font-size:13px;resize:vertical}
.ocrtxt{white-space:pre-wrap;font-family:var(--mono);font-size:12px;max-height:200px;overflow:auto;background:var(--bg);padding:10px;border-radius:6px;margin:8px 0 0}
.chooser{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:14px}
.chooser b{font-size:17px}
.nextgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.nextgrid .btn{min-height:56px}
.nextgrid .btn.go{grid-column:1/-1}
.scanlock{display:flex;gap:14px;align-items:center;border:2px dashed var(--muted);border-radius:12px;padding:16px;background:var(--bg)}
.scanlock .big{font-size:34px;line-height:1;color:var(--muted)}
.scanlock div{display:flex;flex-direction:column;gap:2px}
.scanlock span{font-size:13px;color:var(--muted)}
.scanstate{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.scanstate.on{color:var(--ok)}
.pz{font-family:var(--body);font-size:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:9px;margin-left:4px}
.mini .pz{margin:2px 0 0;align-self:flex-start}
.pzbig{display:inline-block;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:2px 10px;border-radius:10px;margin:4px 0}
.comps{display:flex;flex-direction:column;gap:6px}
.comp{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;text-align:left}
.comp.me{border-color:var(--ink)}
.comp span{color:var(--muted);font-size:13px}
.banner.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.estbtn{margin-top:6px;font-size:12px;color:var(--muted)}
.btn.alt{border-style:dashed}
.btn.alt small{display:block;font-weight:500;font-size:12px}
.estgrid{display:flex;flex-direction:column;gap:8px}
.estrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.estrow.off{border-color:var(--bad);background:var(--bad-bg)}
.estrow div{display:flex;flex-direction:column}
.estrow span{font-size:13px;color:var(--muted)}
.estrow label{display:flex;flex-direction:column;gap:2px}
.estrow select{min-height:36px;padding:4px 8px}
@media (max-width:560px){.estrow{grid-template-columns:1fr 1fr}.estrow>div{grid-column:1/-1}}
.qrtop{margin:6px 0 22px}

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const STATIONS = [
  {id:'rec', name:'Recepción',   avance:'ACTUALIZAR',  checks:['OT y piezas coinciden','Estado de llegada revisado']},
  {id:'dia', name:'Diagnóstico', avance:'Diagnostico', checks:['Pieza evaluada','Servicio confirmado (afilado / cambio de placas)']},

  {id:'wal', name:'Walter',      avance:'Walter',      checks:['Programa cargado','Afilado terminado']},
  {id:'ter', name:'Terminación', avance:'Terminacion', checks:['Medición final','Inspección visual OK','Embalado']},
];
const RUTA = STATIONS.map(s=>s.id);
const ROUTES = {'Afilado':RUTA,'Cambio parcial':RUTA,'Cambio total':RUTA,'Customizado':RUTA};
const servicioDe = cod=>/\bCT\b/.test(cod||'')?'Cambio total':/\bCP\b/.test(cod||'')?'Cambio parcial':/CABEZAL|ART/.test(cod||'')?'Customizado':'Afilado';
const OPERATORS = ['Juan Soto','Pedro Muñoz','Luis Rojas','Marcos Vera','Carla Díaz'];
const BLOCK_REASONS = ['No reparable','Falta material / placas','Máquina detenida','Espera aprobación cliente','Otro'];
const S = id => STATIONS.find(s=>s.id===id);
const COL = 'ordenes';
const APP_URL = location.origin + location.pathname;
/* Código propio de cada QR de estación: solo escaneando el QR se habilita INICIAR */
const QR_KEYS = {"rec": "0e745c", "dia": "a4dd27", "sth": "c19efe", "sol": "703ded", "wal": "ef12de", "ter": "2f6b0d"};
const SCAN_MIN = 15;   // minutos que dura la habilitación después de escanear
/* Conexión a BBDD Servicios 2026 (Google Apps Script). Pega aquí la URL /exec y la clave del script. */
const BBDD_URL_DEF = 'https://script.google.com/macros/s/AKfycbxSx5cUKInVwh8LUEDjElN-gipJtHuPr16a-6qnXx_Zraw5BV9tlKQw2_eIQtY3FjQo4g/exec';
const BBDD_KEY_DEF = 'ing-54b27fd4a4d9';
const day = 864e5;

/* ---------- state ---------- */
let orders = new Map();          // id -> order (mutable clone)
let db = null, dbState = 'connecting';
let view = 'sup';
let ui = {sel:null, blocking:false, newForm:false, created:null, picks:null, scanMsg:null};
const local = (()=>{try{return JSON.parse(localStorage.getItem('ingemad-tablet')||'{}')}catch(e){return {}}})();
if(!local.operario&&local.op){const v=Object.values(local.op).filter(Boolean);if(v.length)local.operario=v[0]}
function saveLocal(){try{localStorage.setItem('ingemad-tablet',JSON.stringify(local))}catch(e){}}
try{const q=new URLSearchParams(location.search).get('e'), h0=location.hash.slice(1);
  if(q&&QR_KEYS[h0]===q){local.scan={st:h0,t:Date.now()};saveLocal()}
  if(location.search) history.replaceState(null,'',location.pathname+location.hash);
}catch(e){}
const scanOK=st=>!!(local.scan&&local.scan.st===st&&Date.now()-local.scan.t<SCAN_MIN*6e4);
try{const h=location.hash.slice(1); if(h==='sup'||S(h)){view=h; if(S(h)) ui.scanMsg={k:'in',t:scanOK(h)?`QR de ${S(h).name} escaneado · puedes iniciar`:`Estás en ${S(h).name}`,s:'Escribe el N° de OT para registrar una entrada, o toca un trabajo en curso para registrar la salida.'}} else if(local.view) view=local.view}catch(e){}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur = o=>o.ruta[o.paso];
const elapsed = o=>(o.acc||0)+(o.estado==='proceso'&&o.t0?Date.now()-o.t0:0);
const fmt = ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')};
const fmtMin = ms=>Math.round(ms/6e4)+' min';
const hhmm = t=>new Date(t).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
const isLate = o=>false;   // fecha de entrega desactivada por ahora
const all = ()=>[...orders.values()];
/* Componentes: cada pieza es una unidad de trabajo; la OT agrupa sus piezas */
const ENTERA='Herramienta completa';
const otOf=o=>o.ot||o.id, otNum=o=>otOf(o).replace(/^OT-/,''), piezaOf=o=>o.pieza||ENTERA;
const nm=o=>otOf(o)+(o.pieza?' · '+o.pieza:'');
const piecesOf=ot=>all().filter(o=>otOf(o)===ot);
const PLANTILLAS={Sierra:['Cuerpo / disco','Placas'],Incisor:['Cuerpo','Placas'],Fresa:['Cuerpo','Placas'],Cabezal:['Cuerpo','Cuchillos','Tornillería'],Cuchillo:['Cuchillos'],Herramienta:['Cuerpo','Piezas']};
function tipoHerr(o){const D=((o.detalle||'')+' '+(o.codigo||'')+' '+(o.medida||'')).toUpperCase();
  return /CABEZAL/.test(D)?'Cabezal':/CUCHILL|I1AFC/.test(D)?'Cuchillo':/FRESA|I1AFF|I1FAB/.test(D)?'Fresa':/INCISOR|I1AFS I\b/.test(D)?'Incisor':/SIERRA|I1AFS/.test(D)?'Sierra':'Herramienta'}
/* Estaciones fuera de servicio y su alternativa */
const EQUIV={sth:'wal',wal:'sth'};
let EST={}; try{EST=JSON.parse(localStorage.getItem('ingemad-est')||'{}')}catch(e){}
const fuera=id=>!!EST[id]?.fuera, altDe=id=>EST[id]?.alt||EQUIV[id]||'';
const active = ()=>all().filter(o=>o.estado!=='despachada');
const atStation = id=>active().filter(o=>cur(o)===id).sort((a,b)=>(b.estado==='proceso')-(a.estado==='proceso')||(b.prio==='alta')-(a.prio==='alta')||a.due-b.due);
const comingTo = id=>active().filter(o=>o.ruta[o.paso+1]===id && o.estado==='proceso');
const stateLbl={cola:'En cola',proceso:'En proceso',pausa:'En pausa',bloqueada:'Bloqueada',despachada:'Terminada'};
const chip = o=>`<span class="chip s-${o.estado}">${stateLbl[o.estado]}</span>`;
function dueTxt(o){return '';
  const diff=Math.round((new Date(o.due).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/day);
  if(o.estado==='despachada') return '<span class="due">Despachada</span>';
  if(diff<0) return `<span class="late">Atrasada ${-diff} d</span>`;
  if(diff===0) return `<span class="${isLate(o)?'late':'due'}">Entrega hoy</span>`;
  return `<span class="due">${diff===1?'Mañana':new Date(o.due).toLocaleDateString('es-CL',{weekday:'short',day:'numeric'})}</span>`}
function toast(t,bad){const el=$('#toast');el.textContent=t;el.className='toast'+(bad?' bad':'');el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}
function log(o,x){o.log=[{t:Date.now(),x:x+(o.op?` · ${o.op}`:''),st:view},...(o.log||[])].slice(0,60)}

/* ---------- db ---------- */
const STORE='ingemad-ordenes-v2';
const SEED_NOW=0, SEED=[];
function saveOrders(){try{localStorage.setItem(STORE,JSON.stringify([...orders.values()]))}catch(e){toast('No se pudo guardar en este equipo',true)}}
function persist(o){o.upd=Date.now();orders.set(o.id,o);saveOrders()}
function loadSeed(){
  const d=Date.now()-SEED_NOW, dd=Math.round(d/day)*day;
  return SEED.map(o=>{o=JSON.parse(JSON.stringify(o));if(o.t0)o.t0+=d;if(o.doneAt)o.doneAt+=d;o.due+=dd;(o.log||[]).forEach(l=>l.t+=d);return o});
}
function safeRender(){
  const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','file'].includes(a.type)))&&a.value){clearTimeout(safeRender.h);safeRender.h=setTimeout(safeRender,1500);return}
  render();
}
function connect(){
  let list=null; try{list=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
  if(!Array.isArray(list)){list=loadSeed();orders=new Map(list.map(o=>[o.id,o]));saveOrders()}
  else orders=new Map(list.map(o=>[o.id,o]));
  dbState='on'; render(); syncPendientes(false);
}
window.addEventListener('storage',e=>{if(e.key===STORE){try{orders=new Map(JSON.parse(e.newValue||'[]').map(o=>[o.id,o]))}catch(x){}safeRender()}});

/* ---------- BBDD Drive ---------- */
const bbddCfg=()=>({url:(local.bbddUrl||BBDD_URL_DEF||'').trim(),key:(local.bbddKey||BBDD_KEY_DEF||'').trim()});
const bbddOn=()=>!!bbddCfg().url;
async function bbddGet(params){
  const c=bbddCfg(); if(!c.url) throw new Error('sin_config');
  const u=c.url+(c.url.includes('?')?'&':'?')+new URLSearchParams({...params,token:c.key}).toString();
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(u,{signal:ctl.signal});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j}finally{clearTimeout(to)}
}
async function bbddPost(body){
  const c=bbddCfg(); if(!c.url) throw new Error('sin_config');
  const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:c.key})});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'error'); return j;
}
const CODIGOS=[['I1AFS','Afilado sierra'],['I1AFS I','Afilado incisor'],['I1AFF','Afilado fresa'],['I1AFC','Afilado cuchillo'],['I1AF15','Afilado fresa ranuradora'],['I1AFS CP','Cambio parcial placas'],['I1AFS CT','Cambio total placas'],['I1FAB FR','Evaluación fresa'],['I1FAB FR CP','Fresa cambio parcial'],['I1FAB FR CT','Fresa cambio total'],['I1CABEZAL','Cabezal (customizado)'],['ART','Artículo (customizado)']];
function codigoDe(desc){const D=String(desc).toUpperCase();
  if(/CAMBIO\s+TOTAL/.test(D))return 'I1AFS CT'; if(/CAMBIO|PLACA/.test(D))return 'I1AFS CP';
  if(/INCISOR/.test(D))return 'I1AFS I'; if(/FRESA/.test(D))return 'I1AFF'; if(/CUCHILLO/.test(D))return 'I1AFC';
  if(/AFILADO/.test(D))return 'I1AFS'; return '';}
function tipoDe(items){return servicioDe(items.map(x=>x.codigo||codigoDe(x.detalle||'')).join(' '));
  const D=items.map(x=>(x.servicio||'')+' '+(x.detalle||'')+' '+(x.codigo||'')).join(' ').toUpperCase();
  return /SOLDAD|HUINCHA|CINTA/.test(D)?'Sierra huincha':/CAMBIO|PLACA| CP\b| CT\b/.test(D)?'Sierra circular':'Afilado simple';}
function medidaDe(desc){const D=String(desc).toUpperCase();let dia=(D.match(/\bDE\s+(\d{2,4})\b/)||D.match(/\bD\s?(\d{2,4})\b/)||[])[1];const z=(D.match(/Z\s*=\s*(\d{1,3})/)||[])[1];
  return [dia?`Ø ${dia} mm`:'',z?`${z} Z`:'',/\bTP\b/.test(D)?'TP':'',/PCD/.test(D)?'PCD':''].filter(Boolean).join(' ');}
function orderFromBBDD(d,station){
  const tipo=tipoDe(d.items), ru=RUTA;
  const st0=S(station)?station:'rec';
  const i=ru.indexOf(st0);
  const fecha=d.fecha?new Date(d.fecha+'T12:00:00').getTime():Date.now();
  return {id:'OT-'+d.ot,cliente:d.cliente,tipo,medida:[...new Set(d.items.map(x=>medidaDe(x.detalle)).filter(Boolean))].join(' / ')||'—',
    cant:d.items.reduce((a,x)=>a+(+x.cant||1),0),prio:'normal',due:fecha+(tipo==='Afilado'?4:10)*day,fechaOT:d.fecha,ruta:ru,paso:i>=0?i:0,estado:'cola',acc:0,t0:null,op:null,checks:{},tiempos:{},motivo:null,
    bbdd:true,rut:d.rut||'',codigo:[...new Set(d.items.map(x=>x.codigo).filter(Boolean))].join(', '),detalle:d.items.map(x=>`${x.cant} × ${x.detalle}`).join('\n'),
    log:[{t:Date.now(),x:`Traída de base de prueba en ${S(i>=0?station:ru[0]).name}`+(local.operario?` · ${local.operario}`:'')}]};
}
const fechaISO=f=>{const m=String(f||'').match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:/^\d{4}-\d\d-\d\d$/.test(f||'')?f:''};

/* ---------- lookup ---------- */
const norm = s=>String(s??'').trim().toUpperCase().replace(/^INGEMAD[:\s]*/,'').replace(/\s+/g,'');
function lookup(raw){
  const c=norm(raw); if(!c) return [];
  const ot = /^\d+$/.test(c)?'OT-'+c : c.replace(/^OT(\d)/,'OT-$1');
  const n=ot.replace(/^OT-0*/,'OT-');
  return piecesOf(n).sort((a,b)=>(cur(b)===view)-(cur(a)===view)||(a.estado==='despachada')-(b.estado==='despachada'));
}
function stationFromCode(raw){
  const t=String(raw||'').trim(); const m=t.match(/#([a-z]+)\s*$/i)||t.match(/^EST[:\-\s]*([a-z]+)$/i);
  return m&&(S(m[1].toLowerCase())||m[1].toLowerCase()==='sup')?m[1].toLowerCase():null;
}
function handleScan(raw){
  const st=stationFromCode(raw); if(st){go(st);ui.scanMsg={k:'in',t:`Estás en ${st==='sup'?'Supervisor':S(st).name}`,s:'Escribe el N° de OT para registrar una entrada, o toca un trabajo en curso para registrar la salida.'};return render()}
  const res=lookup(raw); ui.result=null; ui.blocking=false; ui.newForm=false; ui.created=null; ui.picks=null; ui.scanMsg=null; ui.notFound=null; ui.bbddErr=false;
  if(!res.length){
    const q=norm(raw).replace(/^OT-?/,'').replace(/^0+/,'');
    if(bbddOn()&&/^\d+$/.test(q)){ui.sel=null;ui.loading=`Buscando OT ${q} en base de prueba…`;render();
      bbddGet({action:'ot',ot:q}).then(d=>{ui.loading=null;
        if(d.found){const st=view==='sup'?'rec':view;const o=orderFromBBDD(d,st);persist(o);ui.sel=o.id;ui.scanMsg={k:'in',t:`OT ${q} traída de base de prueba`,s:o.ruta.includes(st)?`Quedó en la fila de ${S(st).name}.`:`${o.tipo} no pasa por ${S(st).name}: quedó en Recepción.`};render()}
        else{ui.notFound=q;render()}
      }).catch(e=>{ui.loading=null;ui.notFound=q;ui.bbddErr=true;render()});return}
    ui.sel=null;ui.notFound=q||raw.trim();return render()}
  if(res.length>1){ui.sel=null;ui.picks={q:raw.trim(),list:res};return render()}
  openOrder(res[0]);
}
function openOrder(o){ui.sel=o.id; ui.picks=null; ui.scanMsg=null; render()}
/* ---------- actions ---------- */
function checksOk(o){const s=S(cur(o));return s.checks.every((c,i)=>{const v=(o.checks||{})[i];return typeof c==='object'?v!==undefined&&v!=='':!!v})}
function entrada(o){setTimeout(()=>avanceOT(o),0);const esp=o.colaDesde&&!(o.acc>0)?Math.round((Date.now()-o.colaDesde)/6e3)/10:'';o.op=local.operario;o.estado='proceso';o.t0=Date.now();registrar(o,'Inicio',{op:o.op,min:esp,nota:esp!==''?'Minutos = espera en cola':''});o.colaDesde=null;o.llegada=null;log(o,((o.acc||0)?'Reanuda ':'Entrada a ')+S(cur(o)).name);persist(o)}
function llegada(o,st){
  const prev=cur(o), now=Date.now();
  if(o.estado==='proceso'||o.estado==='pausa'){        // fase anterior abierta: se cierra con la hora de llegada
    if(o.estado==='proceso'&&o.t0){o.acc=(o.acc||0)+now-o.t0;o.t0=null}
    o.tiempos={...(o.tiempos||{}),[prev]:(o.tiempos?.[prev]||0)+(o.acc||0)};
    registrar(o,'Término',{fase:S(prev).name,min:Math.round((o.acc||0)/6e3)/10,pasaA:S(st).name,op:o.op,nota:`Cerrada al llegar a ${S(st).name}`});
    log(o,`${S(prev).name} cerrada automáticamente al llegar a ${S(st).name} (${fmtMin(o.acc||0)})`);
    o.autoCierre=(o.autoCierre||0)+1;
  }
  o.acc=0;o.op=null;o.checks={};o.paso=o.ruta.indexOf(st);o.estado='cola';o.llegada=now;o.colaDesde=now;
  registrar(o,'Llegada',{fase:S(st).name,op:local.operario||''});
  log(o,`Llegada a ${S(st).name}`);avanceOT(o);persist(o);
  ui.scanMsg={k:'in',t:`Llegada a ${S(st).name} registrada · ${hhmm(now)}`,s:'Queda en cola. Presiona Iniciar cuando la máquina parta.'};
}
function salida(o,destino,nota){        // destino: id de estación o 'ok'
  const stn=cur(o); if(o.estado==='proceso'&&o.t0){o.acc=(o.acc||0)+Date.now()-o.t0;o.t0=null}
  o.tiempos={...(o.tiempos||{}),[stn]:(o.tiempos?.[stn]||0)+(o.acc||0)}; log(o,`Salida de ${S(stn).name} (${fmtMin(o.acc||0)})`);
  registrar(o,'Término',{min:Math.round((o.acc||0)/6e3)/10,pasaA:destino==='ok'?'OK':S(destino).name,op:o.op,nota:nota||''});
  o.acc=0;o.checks={};o.op=null;
  let nx;
  if(destino==='ok'){o.estado='despachada';o.doneAt=Date.now();nx='Terminada';avanceOT(o)}
  else{o.paso=o.ruta.indexOf(destino);o.estado='cola';o.colaDesde=Date.now();o.llegada=null;nx=S(destino).name;avanceOT(o)}
  persist(o); return nx;
}
/* trae las OT abiertas de la base y las pone en la fila de su fase */
async function syncPendientes(manual){
  if(!bbddOn()) return;
  try{const r=await bbddGet({action:'pendientes'});let n=0,u=0;
    BASE_AVG=r.promedios||{};
    if(r.estaciones){EST=r.estaciones;try{localStorage.setItem('ingemad-est',JSON.stringify(EST))}catch(e){}}
    r.ots.forEach(d=>{
      const ot='OT-'+d.ot; AV_SENT[ot]=AV_SENT[ot]||d.avance;
      let ps=piecesOf(ot);
      const bp=d.app?.piezas||{}, names=Object.keys(bp);
      if(!ps.length){
        const st=(STATIONS.find(x=>x.avance.toLowerCase()===String(d.avance).toLowerCase())||{id:'rec'}).id;
        const base=orderFromBBDD(d,st);base.log=[{t:Date.now(),x:`Cargada desde la base (AVANCE TALLER: ${d.avance})`}];n++;
        if(!names.length||(names.length===1&&names[0]===ENTERA)){if(bp[ENTERA])aplicarEstado(base,bp[ENTERA]);orders.set(base.id,base);return}
        names.forEach((nmz,i)=>{const p={...JSON.parse(JSON.stringify(base)),id:`${ot}-${i+1}`,ot,pieza:nmz};aplicarEstado(p,bp[nmz]);orders.set(p.id,p)});return}
      if(!names.length) return;
      const locales=ps.map(piezaOf);
      if(names.slice().sort().join('|')!==locales.slice().sort().join('|')&&d.app.ts>Math.max(...ps.map(p=>p.upd||0))){   // otro celular separó la herramienta
        const base=ps[0]; ps.forEach(p=>orders.delete(p.id));
        names.forEach((nmz,i)=>{const p={...JSON.parse(JSON.stringify(base)),id:nmz===ENTERA?ot:`${ot}-${i+1}`,ot:nmz===ENTERA?undefined:ot,pieza:nmz===ENTERA?undefined:nmz};aplicarEstado(p,bp[nmz]);orders.set(p.id,p)});u++;return}
      ps.forEach(p=>{const a=bp[piezaOf(p)];if(a&&a.ts>(p.upd||0)&&!(ui.sel===p.id&&(ui.choosing||ui.blocking||ui.separating))){aplicarEstado(p,a);u++}});
    });
    saveOrders();if(!document.querySelector('#otform')&&!ui.separating)render();
    if(manual)toast(n||u?`${n} OT nuevas · ${u} actualizadas desde la base`:'Todo al día con la base');
  }catch(e){if(manual)toast('No pude leer la base de prueba',true)}
}
setInterval(()=>{if(document.visibilityState==='visible')syncPendientes(false)},30000);
/* una fila por evento en la pestaña "Registro App" */
const enBase=o=>bbddOn()&&(o.bbdd||o.photo);
function registrar(o,evento,extra={}){
  if(!enBase(o)) return;
  const fase=extra.fase||S(cur(o))?.name||'';
  bbddPost({action:'registro',ot:otNum(o),pieza:o.pieza||'',fase,evento,operario:extra.op??o.op??local.operario??'',minutos:extra.min??'',pasaA:extra.pasaA||'',nota:extra.nota||'',ts:Date.now()})
    .catch(()=>{(o.regPend=o.regPend||[]).push({evento,fase,...extra,ts:Date.now()});persist(o)});
}
let BASE_AVG={};
const stByName=n=>STATIONS.find(x=>x.name===n||x.avance.toLowerCase()===String(n).toLowerCase());
function aplicarEstado(o,a){
  const st=stByName(a.fase); if(st) o.paso=o.ruta.indexOf(st.id);
  if(a.estado==='terminada'){o.estado='despachada';o.doneAt=a.ts}
  else{o.estado=a.estado;o.t0=a.t0||null;o.acc=a.acc||0;o.op=a.op||null;if(a.motivo)o.motivo=a.motivo;o.llegada=a.llegada||null;o.colaDesde=a.estado==='cola'?(a.llegada||a.colaDesde||o.colaDesde||null):null}
  o.upd=a.ts;
}
/* AVANCE TALLER = fase del componente más atrasado; OK solo cuando todos terminan */
const AV_SENT={};
function valorAvance(ot){
  const ps=piecesOf(ot), nr=p=>p.estado==='bloqueada'&&p.motivo==='No reparable';
  const abiertas=ps.filter(p=>p.estado!=='despachada'&&!nr(p));
  if(!abiertas.length) return ps.length&&ps.every(nr)?'NO REPARABLE':'OK';
  return S(RUTA[Math.min(...abiertas.map(p=>p.paso))]).avance;
}
function avanceOT(o){
  if(!enBase(o)) return;
  const ot=otOf(o), val=valorAvance(ot);
  if(AV_SENT[ot]===val) return; AV_SENT[ot]=val;
  bbddPost({action:'avance',ot:otNum(o),avance:val}).then(r=>{
    if(r.found===false){delete AV_SENT[ot];return}
    log(o,`Base: AVANCE TALLER de ${ot} = ${val}`);persist(o);if(ui.sel===o.id)render();
  }).catch(()=>{delete AV_SENT[ot];toast(`No pude actualizar AVANCE TALLER de ${ot}`,true)});
}

/* ---------- averages ---------- */
function avgFor(st,tipo){
  const same=all().filter(o=>o.tipo===tipo).map(o=>(o.tiempos||{})[st]).filter(Boolean);
  const any=all().map(o=>(o.tiempos||{})[st]).filter(Boolean);
  const v=same.length>=2?same:any;
  const b=BASE_AVG[S(st)?.name]; if(b&&b.n>=v.length) return {m:b.min*6e4,n:b.n,scope:'registro base'};
  if(!v.length) return null;
  return {m:v.reduce((x,y)=>x+y,0)/v.length,n:v.length,scope:same.length>=2?tipo:'todas las OT'};
}
function cmpInfo(ms,a){
  if(!a) return {k:'none',pct:null,txt:'Sin promedio todavía'};
  const pct=ms/a.m, d=Math.round((ms-a.m)/6e4);
  const k=pct<=1?'ok':pct<=1.25?'warn':'bad';
  const txt=Math.abs(d)<1?'Igual al promedio':d<0?`${-d} min bajo el promedio`:`${d} min sobre el promedio (+${Math.round((pct-1)*100)}%)`;
  return {k,pct,txt};
}
function cmpBar(o,big){
  const a=avgFor(cur(o),o.tipo), ms=elapsed(o), c=cmpInfo(ms,a);
  const w=c.pct==null?0:Math.min(c.pct,1.5)/1.5*100;
  return `<div class="cmpwrap ${big?'big':''}" data-live="${o.id}" data-big="${big?1:''}">
    ${big?`<div class="cmprow"><span>Promedio ${S(cur(o)).name.toLowerCase()}: <b>${a?fmtMin(a.m):'—'}</b>${a?` <span class="hint">(${a.n} OT · ${esc(a.scope)})</span>`:''}</span></div>`:''}
    <div class="cmp"><i class="c-${c.k}" style="width:${w}%"></i>${a?'<em title="Promedio"></em>':''}</div>
    <div class="cmptxt c-${c.k}">${c.txt}</div></div>`;
}

const qrCache={};
function qrCanvas(text,size){
  const key=text+'|'+size; if(qrCache[key]) return qrCache[key];
  if(typeof QRCode==='undefined') return null;
  const tmp=$('#qrtmp'); tmp.innerHTML=''; new QRCode(tmp,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
  const c=tmp.querySelector('canvas'); if(!c) return null;
  const out=document.createElement('canvas');out.width=out.height=size;out.getContext('2d').drawImage(c,0,0);
  return qrCache[key]=out;
}

function poster(g,s,x,y,w,h){
  g.fillStyle='#fff';g.fillRect(x,y,w,h);g.strokeStyle='#1b2326';g.lineWidth=Math.max(3,w/200);g.strokeRect(x+g.lineWidth/2,y+g.lineWidth/2,w-g.lineWidth,h-g.lineWidth);
  g.fillStyle='#f0b400';g.fillRect(x,y,w,h*0.16);
  g.fillStyle='#1b2326';g.textAlign='center';
  g.font=`700 ${Math.round(h*0.07)}px "Barlow Condensed", Arial Narrow, sans-serif`;g.fillText('INGEMAD · ESTACIÓN',x+w/2,y+h*0.11);
  g.font=`700 ${Math.round(h*0.11)}px "Barlow Condensed", Arial Narrow, sans-serif`;g.fillText(s.name.toUpperCase(),x+w/2,y+h*0.29);
  const q=Math.min(w*0.62,h*0.52); const c=qrCanvas(stUrl(s.id),512); if(c){g.imageSmoothingEnabled=false;g.drawImage(c,x+(w-q)/2,y+h*0.34,q,q)}
  g.font=`500 ${Math.round(h*0.035)}px "IBM Plex Sans", Arial, sans-serif`;g.fillText('Escanea al entrar y al salir',x+w/2,y+h*0.93);
  g.textAlign='left';
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const sep=(text.split('\n')[0].match(/;/g)||[]).length>=(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true; else if(ch===sep){row.push(f);f=''} else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''} else if(ch!=='\r')f+=ch}
  if(f||row.length){row.push(f);rows.push(row)} return rows.filter(r=>r.some(x=>x.trim()));
}
function importCSV(text){
  const rows=parseCSV(text); if(rows.length<2) return toast('El archivo no tiene filas',true);
  const H=rows[0].map(h=>h.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  const ix=k=>H.findIndex(h=>h.startsWith(k));
  const I={ot:ix('ot'),oc:ix('oc'),cl:ix('cliente'),tipo:ix('servicio'),med:ix('medida'),cant:ix('cantidad'),due:ix('entrega'),pri:ix('prioridad')};
  if(I.ot<0||I.cl<0) return toast('Faltan columnas OT y Cliente',true);
  let n=0,skip=0;
  rows.slice(1).forEach(r=>{
    const raw=norm(r[I.ot]); if(!raw){skip++;return}
    const id=/^\d+$/.test(raw)?'OT-'+raw:raw.replace(/^OT(\d)/,'OT-$1');
    if(!/^[A-Z0-9_.~:@+-]+$/.test(id)){skip++;return}
    const tipo=Object.keys(ROUTES).find(k=>k.toLowerCase()===String(r[I.tipo]||'').trim().toLowerCase())||'Sierra huincha';
    let due=Date.now()+2*day; const dm=String(r[I.due]||'').trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
    if(dm){due=new Date(+(dm[3].length===2?'20'+dm[3]:dm[3]),+dm[2]-1,+dm[1],18).getTime()}
    const base={oc:String(r[I.oc]??'').trim(),cliente:String(r[I.cl]).trim(),tipo,medida:String(r[I.med]??'').trim(),cant:+r[I.cant]||1,
      due,prio:/urg|alta/i.test(r[I.pri]||'')?'alta':'normal'};
    const ex=orders.get(id);
    const o=ex?{...ex,...base,ruta:ex.tipo===tipo?ex.ruta:ROUTES[tipo]}:{id,...base,ruta:ROUTES[tipo],paso:0,estado:'cola',acc:0,t0:null,op:null,checks:{},tiempos:{},motivo:null,log:[{t:Date.now(),x:'Importada desde ERP'}]};
    if(ex&&ex.tipo!==tipo&&o.paso>=o.ruta.length)o.paso=0;
    persist(o); n++;
  });
  toast(`${n} OT cargadas${skip?` · ${skip} filas omitidas`:''}`); render();
}

function itemsDe(o){
  const lines=String(o.detalle||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const its=lines.map(l=>{const m=l.match(/^(\d{1,3})\s*[×x*]\s*(.+)$/);const d=(m?m[2]:l).trim();return {cant:m?+m[1]:1,detalle:d.toUpperCase(),codigo:o.codigo||codigoDe(d)}});
  return its.length?its:[{cant:o.cant||1,detalle:o.medida&&o.medida!=='—'?o.medida:'',codigo:o.codigo||''}];
}
async function enviarBBDD(o){
  o.bbddPend=true;persist(o);
  try{
    const r=await bbddPost({action:'crear',ot:otNum(o),fecha:o.fechaOT||new Date().toISOString().slice(0,10),cliente:o.cliente==='Sin cliente'?'':o.cliente,rut:o.rut||'',items:itemsDe(o)});
    o.bbddPend=false;if(r.cliente&&r.cliente!==o.cliente)o.cliente=r.cliente;if(r.rut&&!o.rut)o.rut=r.rut;
    log(o,r.duplicada?'Ya existía en base de prueba':`Guardada en base de prueba (fila ${r.fila})`);persist(o);render();
    toast(r.duplicada?`${o.id} ya estaba en la BBDD`:`${o.id} guardada en base de prueba`);
  }catch(e){o.bbddPend=true;log(o,'No se pudo guardar en base de prueba');persist(o);render();toast('No se pudo guardar en la base de prueba: queda pendiente (Supervisor → Reintentar)',true)}

function loadTess(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessP) tessP=new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=()=>{tessP=null;ko(new Error('net'))};document.head.appendChild(sc)});
  return tessP;
}
function prepImage(file){
  return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const sc=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const g=c.getContext('2d');g.filter='grayscale(1) contrast(1.4)';g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      const t=document.createElement('canvas'),ts=Math.min(1,520/Math.max(c.width,c.height));t.width=c.width*ts;t.height=c.height*ts;t.getContext('2d').drawImage(im,0,0,t.width,t.height);
      ok({canvas:c,thumb:t.toDataURL('image/jpeg',.7)})};
    im.onerror=()=>ko(new Error('img'));im.src=u});
}
function parseOT(text){
  const T=String(text).replace(/\r/g,'');
  const U=T.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const lines=T.split('\n').map(l=>l.trim()).filter(Boolean);
  const UL=lines.map(l=>l.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  // N° OT: número largo con ceros a la izquierda (formato Random) o junto a "ORDEN DE TRABAJO"
  let otRaw=(U.match(/ORDEN\s*DE\s*TRABAJO\D{0,25}?(\d[\d ]{4,13}\d)/)||[])[1]||(U.match(/\b(0{2,}\d{4,10})\b/)||[])[1]||'';
  otRaw=otRaw.replace(/\s/g,'');
  const ot=otRaw.replace(/^0+/,'');
  const nv=(U.match(/NOTA\s*(?:DE\s*)?VENTA\s*:?\s*(\d{3,})/)||[])[1]||'';
  const oc=(U.match(/\bO\.?\s?C\.?\s*(?:N[°ºO.]*)?\s*:?\s*(\d{3,})/)||[])[1]||'';
  const vend=(U.match(/VENDEDOR\s*:?\s*([A-Z]{2,5})\b/)||[])[1]||'';
  const MES={ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,SETIEMBRE:9,PTIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};
  let fecha='', fi=-1;
  UL.forEach((l,i)=>{if(fi<0&&/SANTIAGO|\b20\d\d\b/.test(l)&&/\bDE\b/.test(l)){const m=l.match(/(\d{1,2})\s*DE\s*([A-Z]+)\s*(?:DE\s*|D\s*E?\s*)?(20\d\d)?/);if(m){fi=i;const mm=Object.keys(MES).find(k=>m[2].includes(k)||k.endsWith(m[2])&&m[2].length>4);if(mm)fecha=`${m[1]}-${MES[mm]}-${m[3]||new Date().getFullYear()}`}}});
  // cliente: línea "CLIENTE :" o la línea siguiente a la fecha
  let cliente='';
  const ci=UL.findIndex(l=>/CLIENTE\s*:/.test(l));
  const raw=ci>=0?lines[ci].replace(/^.*?CLIENTE\s*:\s*/i,''):(fi>=0&&lines[fi+1]?lines[fi+1]:'');
  cliente=raw.split(/\s(?:VENDEDOR|NRO\.?\s*NOTA|NOTA\s*VENTA)/i)[0].replace(/^[^A-Za-z0-9ÁÉÍÓÚÑ]+/,'').replace(/\s{2,}/g,' ').trim().slice(0,60);
  // ítems
  const KW=/(AFILADO|SOLDADURA|SOLDAR|REPARACION|REPARAR|CAMBIO|TENSIONADO|RECTIFICADO|LAMINADO|TRABADO|INSERTO|DIENTE|SIERRA|HUINCHA|CINTA)/;
  const items=[];
  UL.forEach((l,i)=>{const k=l.search(KW);if(k<0||/CODIGO|DESCRIPCION/.test(l))return;
    let desc=lines[i].slice(k).replace(/\s+[-—_|;:.,]*\s*$/,'');
    desc=desc.replace(/\b2\s*=\s*(\d)/g,'Z=$1').replace(/\bZ\s*=\s*/gi,'Z=');
    if(!/SIERRA|AFILADO|SOLDAD|HUINCHA|CINTA/i.test(desc))return;
    const q=(l.slice(0,k).match(/^\D{0,2}(\d{1,3})\b/)||[])[1];
    const D=desc.toUpperCase();
    let dia=(D.match(/\bDE\s+(\d{2,4})\b/)||[])[1]; if(dia&&(+dia<100||+dia>1200))dia=undefined; const z=(D.match(/Z=(\d{1,3})/)||[])[1];
    items.push({cant:q?+q:1,desc:desc.slice(0,80),dia,z,tp:/\bTP\b/.test(D),pcd:/PCD/.test(D)});
  });
  const D=items.map(x=>x.desc.toUpperCase()).join(' ');
  const tipo=/SOLDAD|HUINCHA|CINTA/.test(D)?'Sierra huincha':/INSERTO|DIENTE|REPARA|CAMBIO/.test(D)?'Sierra circular':/AFILADO/.test(D)?'Afilado simple':'';
  const medida=items.map(x=>[x.dia?`Ø ${x.dia} mm`:'',x.z?`${x.z} Z`:'',x.tp?'TP':'',x.pcd?'PCD':''].filter(Boolean).join(' ')).filter(Boolean).join(' / ');
  const cant=items.reduce((a,x)=>a+x.cant,0)||'';
  const nums=[...new Set((U.match(/\b\d{4,12}\b/g)||[]).map(n=>n.replace(/^0+/,'')).filter(n=>n.length>=4&&!/^20\d\d$/.test(n)))];
  const cands=[...new Set([ot,...nums].filter(Boolean))].slice(0,6);
  return {ot,oc:oc||nv,vendedor:vend,fecha,cliente,items,tipo,medida,cant,cands};
}
async function readOTPhoto(file){
  ui={sel:null,ocr:{pct:0,msg:'Preparando foto…'}};render();
  let img;try{img=await prepImage(file)}catch(e){ui.ocr=null;render();return toast('No se pudo abrir la foto',true)}
  ui.ocr.thumb=img.thumb;ui.ocr.msg='Cargando lector de texto…';render();
  try{await loadTess()}catch(e){ui={sel:null,newForm:true,prefill:{photo:img.thumb,forceRec:true,cands:[]}};render();return toast('Sin internet para leer la foto: completa los datos a mano',true)}
  try{
    const r=await Tesseract.recognize(img.canvas,'spa',{logger:m=>{if(m.status==='recognizing text'&&ui.ocr){ui.ocr.pct=Math.round(m.progress*100);ui.ocr.msg='Leyendo la OT…';const b=$('#ocrbar');if(b)b.style.width=ui.ocr.pct+'%';const t=$('#ocrmsg');if(t)t.textContent=`Leyendo la OT… ${ui.ocr.pct}%`}}});
    const text=r.data.text||'', d=parseOT(text);
    const ex=d.ot&&piecesOf('OT-'+d.ot)[0];
    if(ex){ui={sel:ex.id,ocr:null,scanMsg:{k:'in',t:`${ex.id} ya está en la app`,s:'La abrí para que la trabajes.'}};return render()}
    if(d.ot&&bbddOn()){ui.ocr.msg=`Leí la OT ${d.ot}. Buscando en base de prueba…`;ui.ocr.pct=100;render();
      try{const b=await bbddGet({action:'ot',ot:d.ot});
        if(b.found){const o=orderFromBBDD(b,'rec');o.photo=true;persist(o);ui={sel:o.id,ocr:null,scanMsg:{k:'in',t:`OT ${d.ot} encontrada en base de prueba`,s:'Usé los datos de la base. Quedó en la fila de Recepción.'}};return render()}
        if(d.cliente){try{const c=await bbddGet({action:'cliente',q:d.cliente});if(c.match){d.clienteOrig=d.cliente;d.cliente=c.match.nombre;d.rut=c.match.rut||''}}catch(x){}}
      }catch(x){toast('No pude consultar la BBDD: revisa los datos a mano',true)}}
    ui={sel:null,ocr:null,newForm:true,prefill:{...d,text,photo:img.thumb,forceRec:true}};render();
    toast(d.ot?`Leí la OT ${d.ot}: revisa cliente y medida`:'No encontré el N° de OT: elígelo o escríbelo');
  }catch(e){ui={sel:null,newForm:true,prefill:{photo:img.thumb,forceRec:true,cands:[]}};render();toast('No pude leer la foto: completa los datos a mano',true)}
}
function ocrPanel(){const o=ui.ocr;return `<div class="work"><div class="ocr-prev">${o.thumb?`<img src="${o.thumb}" alt="Foto de la OT">`:''}<div class="ocr-side"><h2>Foto de OT</h2>
  <span id="ocrmsg">${esc(o.msg)}${o.pct?` ${o.pct}%`:''}</span><div class="cmp big"><i id="ocrbar" class="c-ok" style="width:${o.pct}%"></i></div>
  <span class="hint">La primera vez tarda un poco más porque descarga el lector.</span></div></div></div>`}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.closest('form')&&!t.dataset.act&&!t.dataset.cand) return;
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.cand){const f=$('#f-ot');if(f)f.value=t.dataset.cand;document.querySelectorAll('.cand').forEach(b=>b.classList.toggle('on',b===t));if(ui.prefill)ui.prefill.ot=t.dataset.cand;return}
  if(t.dataset.go){go(t.dataset.go);ui.sel=t.dataset.sel;return render()}
  if(t.dataset.pick){const o=orders.get(t.dataset.pick);if(o)openOrder(o,true);return}
  if(t.dataset.sel){ui={sel:t.dataset.sel,choosing:false,separating:false,blocking:false,newForm:false,created:null,picks:null,scanMsg:null};render();if(matchMedia('(max-width:820px)').matches)scrollTo({top:$('.work')?.offsetTop-70||0,behavior:'smooth'});return}
  if(t.id==='newot'){ui={sel:null,newForm:true,prefill:{}};return render()}
  if(t.dataset.act==='addfound'){ui={sel:null,newForm:true,prefill:{ot:ui.notFound}};return render()}
  const a=t.dataset.act;
  if(a==='clearres'){ui.result=null;render();setTimeout(()=>$('#scan')?.focus(),0);return}
  if(a==='cancelnew'){ui.newForm=false;ui.notFound=null;ui.prefill=null;return render()}
  if(a==='dlqr') return downloadStation(t.dataset.id);
  if(a==='est-off'){const id=t.dataset.est||view;ui.estForm=id;if(view==='sup'){setEstacion(id,true,'');return}render();scrollTo(0,0);return}
  if(a==='est-on'){setEstacion(t.dataset.est||view,false,'');return}
  if(a==='est-motivo'){setEstacion(ui.estForm,true,t.dataset.m);return}
  if(a==='est-cancel'){ui.estForm=null;render();return}
  if(a==='cfgsave'){local.bbddUrl=$('#cfg-url').value.trim();local.bbddKey=$('#cfg-key').value.trim();saveLocal();render();
    if(!bbddOn())return toast('Conexión borrada');bbddGet({action:'ping'}).then(()=>toast('Conectado a la base de prueba')).catch(e=>toast(e.message==='clave'?'La clave no coincide con la del script':'No pude conectar: revisa la URL',true));return}
  if(a==='syncbbdd'){syncPendientes(true);return}
  if(a==='retrybbdd'){all().forEach(o=>{const q=o.regPend||[];o.regPend=[];q.forEach(e=>registrar(o,e.evento,e));persist(o)});all().filter(o=>o.bbddPend).forEach(o=>enviarBBDD(o));return}
  if(a==='reviewed'){const r=orders.get(t.dataset.id);if(r){r.manual=false;log(r,'Verificada en Random');persist(r);toast(`${r.id} revisada`);render()}return}
  if(a==='dlsheet') return downloadSheet();
  if(a==='clearex'){
    if(!ui.confirmClear){ui.confirmClear=true;return render()}
    ui.confirmClear=false; all().filter(o=>o.ejemplo).forEach(o=>orders.delete(o.id));saveOrders();toast('Ejemplos borrados');return render()}
  if(a==='resetdemo'){if(!ui.confirmReset){ui.confirmReset=true;return render()}ui.confirmReset=false;orders=new Map(loadSeed().map(o=>[o.id,o]));saveOrders();toast('Maqueta reiniciada');return go('sup')}
  const o=ui.sel&&orders.get(ui.sel); if(!o) return;
  ui.scanMsg=null;
  if(t.dataset.reason){ if(o.estado==='proceso'&&o.t0){o.acc=(o.acc||0)+Date.now()-o.t0;o.t0=null}
    o.estado='bloqueada';o.motivo=t.dataset.reason;ui.blocking=false;log(o,'Bloqueada: '+o.motivo);registrar(o,'Bloqueo',{nota:o.motivo});persist(o);avanceOT(o);toast(`${o.id} bloqueada`)}
  else if((a==='start'||a==='arrive')&&!scanOK(view)){toast(`Escanea el QR de ${S(view).name} para iniciar`,true)}
  else if(a==='start'){entrada(o);ui.scanMsg={k:'in',t:`Iniciado ${hhmm(Date.now())}`}}
  else if(a==='arrive'){llegada(o,view)}
  else if(a==='pause'){const seg=Date.now()-o.t0;o.acc=(o.acc||0)+seg;o.t0=null;o.estado='pausa';log(o,'Pausa');registrar(o,'Pausa',{min:Math.round(seg/6e3)/10});persist(o)}
  else if(a==='block'){ui.blocking=true}
  else if(a==='separar'){ui.separating=true;ui.sepExtra=[]}
  else if(a==='sep-cancel'){ui.separating=false}
  else if(a==='sep-add'){const v=($('#sep-new')?.value||'').trim();if(v){ui.sepExtra=[...(ui.sepExtra||[]),v]}}
  else if(a==='sep-ok'){const names=[...document.querySelectorAll('.sepck:checked')].map(x=>x.value);if(names.length<2){toast('Marca al menos 2 componentes',true);return}ui.separating=false;separar(o,names);return}
  else if(a==='cancelblock'){ui.blocking=false}
  else if(a==='unblock'){o.estado='pausa';o.motivo=null;log(o,'Desbloqueada');registrar(o,'Desbloqueo');persist(o)}
  else if(a==='finish'){ui.choosing=true}
  else if(a==='cancelnext'){ui.choosing=false}
  else if(t.dataset.next){const st=cur(o),ms=elapsed(o),avg=avgFor(st,o.tipo);const rp=t.dataset.reemp,nx=salida(o,t.dataset.next,rp?`Reemplazo de ${S(rp).name} (fuera de servicio)`:'');if(rp)log(o,`${S(rp).name} fuera de servicio: derivada a ${S(t.dataset.next).name}`);ui.choosing=false;ui.sel=null;ui.result={id:o.id,ms,avg,next:nx,stName:S(st).name}}
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='op'){local.operario=t.value;saveLocal();return render()}
  if(t.id==='f-tipo') return updRoute();
  if(t.dataset.alt!==undefined){const id=t.dataset.alt;EST[id]={...(EST[id]||{}),alt:t.value};try{localStorage.setItem('ingemad-est',JSON.stringify(EST))}catch(e){}
    if(bbddOn())bbddPost({action:'estacion',id,fuera:!!EST[id].fuera,motivo:EST[id].motivo||'',alt:t.value,nombre:S(id).name,por:local.operario||''}).catch(()=>{});toast(`Alternativa de ${S(id).name}: ${t.value?S(t.value).name:'ninguna'}`);return}
  if(t.id==='otphoto'&&t.files[0]){const f=t.files[0];t.value='';return readOTPhoto(f)}
  if(t.id==='csv'&&t.files[0]){const r=new FileReader();r.onload=()=>importCSV(String(r.result));r.readAsText(t.files[0]);return}
  const o=ui.sel&&orders.get(ui.sel); if(!o) return;
  if(t.dataset.chk!==undefined){o.checks={...(o.checks||{}),[t.dataset.chk]:t.checked};persist(o);render()}
  if(t.dataset.num!==undefined){o.checks={...(o.checks||{}),[t.dataset.num]:t.value};persist(o);render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='scanform'){const v=$('#scan').value;if(v.trim())handleScan(v);return}
  if(e.target.id==='noteform'){const v=$('#note').value.trim();const o=ui.sel&&orders.get(ui.sel);if(v&&o){log(o,v);persist(o);render()}return}
  if(e.target.id==='otform'){
    const pf=ui.prefill||{}, tipo=servicioDe($('#f-cod').value), ru=RUTA;
    const num=norm($('#f-ot').value).replace(/^OT-?/,'').replace(/^0+/,'');
    if(!/^\d{3,10}$/.test(num)) return toast('Escribe el N° de OT (solo números)',true);
    const id='OT-'+num;
    if(piecesOf(id).length) return toast(`${id} ya está en la app`,true);
    const toRec=!!pf.forceRec;
    const paso=toRec?0:Math.max(0,ru.indexOf(view));
    const det=($('#f-det')?.value||'').trim();
    const fechaV=$('#f-fecha').value, cod=$('#f-cod').value, rut=$('#f-rut').value.replace(/[^0-9kK]/g,'');
    const o={id,cliente:$('#f-cl').value.trim()||'Sin cliente',tipo,medida:$('#f-med').value.trim()||'—',cant:+$('#f-cant').value||1,prio:$('#f-pri').value,
      due:(fechaV?new Date(fechaV+'T18:00').getTime():Date.now())+(tipo==='Afilado'?4:10)*day,codigo:cod,rut:rut||undefined,ruta:ru,paso,estado:'cola',acc:0,t0:null,op:null,checks:{},tiempos:{},motivo:null,
      photo:toRec||undefined,detalle:det||undefined,fechaOT:fechaV||undefined,manual:true,
      log:[{t:Date.now(),x:(toRec?`Ingresada desde foto (${S(view).name})`:`Ingresada solo con N° en ${S(view).name}`)+(local.operario?` · ${local.operario}`:'')}]};
    const fi=$('#f-in');
    if(fi&&fi.checked&&ru[paso]===view){orders.set(o.id,o);entrada(o)} else persist(o);
    ui={sel:null,newForm:false,created:id}; render(); toast(`${id} ingresada`);
    if(toRec&&bbddOn()) enviarBBDD(o);
  }
});

let n=0;
function tick(){
  $('#clock').textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  const tm=$('#timer'),o=ui.sel&&orders.get(ui.sel);
  if(tm&&o) tm.textContent=fmt(elapsed(o));
  document.querySelectorAll('[data-tm]').forEach(el=>{const x=orders.get(el.dataset.tm);if(x)el.textContent=fmt(elapsed(x))});
  if(n%5===0) document.querySelectorAll('[data-live]').forEach(el=>{const x=orders.get(el.dataset.live);if(x&&x.estado==='proceso'){const t=document.createElement('div');t.innerHTML=cmpBar(x,!!el.dataset.big);el.replaceWith(t.firstElementChild)}});
  n++;
  if(view==='sup'&&n%10===0){const y=scrollY;renderSup();fillQR();scrollTo(0,y)}
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if((h==='sup'||S(h))&&h!==view)go(h)});
render(); tick(); setInterval(tick,1000); connect();
</script>
